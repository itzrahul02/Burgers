server:
  port: 8080

spring:
  application:
    name: burger-backend

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/burgers}

  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  access-token:
    secret: ${JWT_ACCESS_SECRET:your-access-token-secret-key-min-256-bits-long-here}
    expiration: 900000  # 15 minutes
  refresh-token:
    secret: ${JWT_REFRESH_SECRET:your-refresh-token-secret-key-min-256-bits-long-here}
    expiration: 604800000  # 7 days

# Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Razorpay
razorpay:
  api-key: ${RAZORPAY_API_KEY:}
  api-secret: ${RAZORPAY_API_SECRET:}

# Rate Limiting
rate-limit:
  requests-per-minute: 60

# CORS
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
